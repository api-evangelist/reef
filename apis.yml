name: REEF
description: 'REEF Technology operates a network of urban logistics and proximity real-estate
  locations, transforming underutilized spaces such as parking lots into multi-purpose
  neighborhood hubs for goods, services, and experiences. Through its "Power of Proximity"
  model and its Ulysses operator program, REEF connects brands, cloud/ghost kitchens,
  delivery, and mobility services to local consumers while helping property owners diversify
  revenue. Backed by SoftBank Vision Fund, REEF is a logistics and real-estate operator; it
  publishes no public developer API, SDK, or documentation surface at this time.'
